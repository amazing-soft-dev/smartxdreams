version: 2

# Weekly update pull requests into dev. Dependabot opens them itself. After CI passes,
# merge-passing-pr.yml merges GitHub Actions updates and npm minor and patch updates. A person reviews
# npm major updates and any Dependabot branch someone else has pushed to. See docs/pipeline.md.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: dev
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: dev
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
