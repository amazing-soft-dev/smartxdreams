version: 2

# Weekly update pull requests into dev. Dependabot opens them itself. After CI passes,
# merge-passing-pr.yml merges each one into dev, and the dev -> main promotion carries it to main.
# A Dependabot branch someone else has pushed to is left for a person. See docs/pipeline.md.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: dev
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: dev
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
