name: Merge passing pull request

# After CI succeeds on a pull request, merge-commit it, but only while its head is still the commit CI
# checked (--match-head-commit). Eligible pairs:
#   <feat|fix|docs|ci|build>/<n>-<slug> -> dev, dev -> main, and dependabot/* -> dev when both the pull
#   request and the checked commit are dependabot[bot]'s (a branch someone else pushed to waits for a person).
# Anything else, forks included, is left alone. Merging into dev pushes dev, which opens or updates the
# dev -> main pull request, whose own CI run merges it.
#
# Uses the GH_TOKEN secret: a merge made with the default token would not start the next workflow.
# workflow_run workflows are read from the default branch (main). See docs/pipeline.md.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  merge:
    name: Merge if eligible
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: merge-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      REPO: ${{ github.repository }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      RUN_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Merge the checked pull request
        run: |
          set -euo pipefail
          prs=$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" --state open \
                  --json number,baseRefName,headRefOid,isCrossRepository,author \
                  --jq '[.[] | select(.isCrossRepository == false)]')

          while read -r row; do
            number=$(jq -r .number <<< "$row")
            base=$(jq -r .baseRefName <<< "$row")
            author=$(jq -r .author.login <<< "$row")

            eligible=false
            if [ "$base" = dev ] && [[ "$HEAD_BRANCH" =~ ^(feat|fix|docs|ci|build)/[0-9]+-[A-Za-z0-9._-]+$ ]]; then eligible=true; fi
            if [ "$base" = main ] && [ "$HEAD_BRANCH" = dev ]; then eligible=true; fi
            if [ "$base" = dev ] && [[ "$HEAD_BRANCH" == dependabot/* ]] && [[ "$author" =~ ^(app/dependabot|dependabot\[bot\])$ ]] &&
               [ "$(gh api "repos/$REPO/commits/$RUN_SHA" --jq '.author.login // ""')" = "dependabot[bot]" ]; then
              eligible=true
            fi
            if [ "$eligible" != true ]; then
              echo "::notice::#$number ($HEAD_BRANCH -> $base) is not eligible for an automatic merge. Leaving it."
              continue
            fi
            if [ "$(jq -r .headRefOid <<< "$row")" != "$RUN_SHA" ]; then
              echo "::notice::#$number moved past the commit CI checked ($RUN_SHA). The newer run will merge it."
              continue
            fi

            echo "Merging #$number ($HEAD_BRANCH -> $base) at $RUN_SHA."
            if ! gh pr merge "$number" --repo "$REPO" --merge --match-head-commit "$RUN_SHA"; then
              # A push landing mid-merge is refused by --match-head-commit, as intended: the newer run merges.
              if [ "$(gh pr view "$number" --repo "$REPO" --json headRefOid --jq .headRefOid)" != "$RUN_SHA" ]; then
                echo "::notice::#$number moved while merging. The newer run will merge it."
                continue
              fi
              echo "::error::Merging #$number failed at the checked head $RUN_SHA."
              exit 1
            fi
          done < <(jq -c '.[]' <<< "$prs")
