name: CI

# One job, on pull requests only. A change gets two runs: its pull request into dev, and the dev -> main
# promotion pull request. Pushes to dev and main do not run CI again, because the promotion pull request
# already checks that exact tree. The job is named "CI passed", the single required check, and it runs
# every gate in order of cost, so a cheap failure stops the run early.

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

# A newer push to the same pull request cancels the older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: actionlint (pinned and checksum-verified)
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Each photo in public/images is used exactly once; every logo file built from assets/ is present.
      - run: npm run check:images
      - run: npm run check:brand

      # The server build, which Vercel runs and Playwright starts with `next start`.
      - run: npm run build
      - run: npm run check:bundle
      - run: npx playwright install --with-deps chromium
      # Smoke test of every page, axe on every page, and Home's throttled LCP and CLS.
      - run: npm run test:e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Last, the static export: plain HTML in out/, with no /api, from the same install.
      - name: Static export
        env:
          NEXT_OUTPUT: export
        run: |
          npm run images
          npm run build
          npm run verify:out
          if [ -d out/api ]; then echo "::error::out/api must not exist in the static export"; exit 1; fi
